    .wordmark-logo{display:block;width:3.85em;height:auto;fill:currentColor;stroke:none;overflow:visible}
    .wordmark-dot{fill:var(--berry)}
    .wordmark span,h1 span{color:var(--berry)}
    main{display:grid;align-content:end;gap:28px;padding:48px var(--gutter) clamp(40px,8vw,96px)}
    .code{color:var(--muted);font-size:14px;letter-spacing:.08em}
    h1{margin:0;font-size:clamp(52px,13vw,200px);font-weight:800;line-height:.86;letter-spacing:-.065em}
    p{margin:0;max-width:34ch;font-size:clamp(18px,2vw,24px)}
    .button{display:inline-flex;align-items:center;justify-content:space-between;gap:24px;justify-self:start;min-height:56px;padding:0 22px;background:var(--berry);color:#fff;font-weight:700}
    .button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
